# Mounts the ojAlgo clone at /repo for the KTester generator (test-survival, ojAlgo experiment).
# Use together with compose.yml:
#   docker compose -f compose.yml -f compose.ojAlgo.yml run --rm ktester ...
services:
  ktester:
    env_file: [.env]
    volumes:
      - /Users/donggi/_projects/experiment-projects/ojAlgo:/repo
